<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10"><link rel="manifest" href="manifest.webmanifest"><title>WINTER ARC 3.4</title>
<style>
:root{--bg:#080b10;--card:#111720;--line:#293440;--text:#f5f7fb;--muted:#8d99a8;--blue:#8bd3ff;--green:#78e3a6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1b2935,#080b10 42%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:18px 16px 110px}header{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 16px}.brand{font-size:17px;font-weight:900;letter-spacing:2px}.sub,.tiny{font-size:12px;color:var(--muted)}.avatar{width:42px;height:42px;border-radius:14px;background:#cfe9ff;color:#071019;display:grid;place-items:center;font-weight:900}
.view{display:none}.view.active{display:block}.hero,.card{background:rgba(17,23,32,.96);border:1px solid var(--line);border-radius:24px;padding:18px;margin:12px 0}.hero{background:linear-gradient(145deg,#16202a,#10161e)}h1{font-size:30px;margin:0 0 6px}h2{font-size:21px;margin:4px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#10161e;border:1px solid var(--line);border-radius:19px;padding:15px}.tile b{font-size:13px}.tile .num{font-size:27px;font-weight:850;margin-top:6px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.progress{height:10px;background:#202a34;border-radius:99px;overflow:hidden;margin:14px 0 8px}.fill{height:100%;background:linear-gradient(90deg,#f5fbff,#8bd3ff);border-radius:99px}
input,select{width:100%;background:#0c1117;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:5px 0 10px}button{font:inherit;cursor:pointer}.btn{background:#e7f5ff;color:#071019;border:0;border-radius:13px;padding:11px 14px;font-weight:800}.btn.secondary{background:#1b232d;color:#fff;border:1px solid var(--line)}.btn.danger{background:#32191e;color:#ffcdd3}
.searchrow{display:flex;gap:8px}.searchrow input{margin:0}.result{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}.result:last-child{border:0}.foodicon{width:48px;height:48px;border-radius:13px;background:#1d2934;display:grid;place-items:center;font-size:23px}.result b{display:block}.result small{color:var(--muted)}.meal{padding:12px 0;border-bottom:1px solid var(--line)}.meal:last-child{border:0}.status{padding:10px 12px;border-radius:12px;background:#13221b;color:#a9f3c6;font-size:12px;margin-top:10px}.empty{color:var(--muted);font-size:13px;padding:10px 0}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#090d13ee;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 5px calc(8px + env(safe-area-inset-bottom))}.nav button{flex:1;max-width:145px;background:transparent;border:0;color:#778392;border-radius:14px;padding:7px 3px;font-size:19px}.nav button.active{background:#17202a;color:#fff}.nav small{display:block;font-size:10px}@media(min-width:700px){.nav{width:760px;left:50%;right:auto;transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0}}
</style></head><body><main>
<header><div><div class="brand">WINTER ARC <span style="color:#8bd3ff">3.4</span></div><div class="sub" id="date"></div></div><div class="avatar" id="avatar">A</div></header>
<section id="home" class="view active"></section><section id="streak" class="view"></section><section id="stats" class="view"></section><section id="food" class="view"></section><section id="workout" class="view"></section><section id="tools" class="view"></section>
</main><nav class="nav">
<button data-page="home">⌂<small>Home</small></button><button data-page="streak">🔥<small>Streak</small></button><button data-page="stats">◒<small>Stats</small></button><button data-page="food">🥗<small>Food</small></button><button data-page="workout">🏋️<small>Workout</small></button><button data-page="tools">✦<small>Tools</small></button></nav>
<script>
const FOODS=[["Banane", "Obst", 89, 1.1], ["Apfel", "Obst", 52, 0.3], ["Orange", "Obst", 47, 0.9], ["Erdbeeren", "Obst", 32, 0.7], ["Blaubeeren", "Obst", 57, 0.7], ["Avocado", "Obst", 160, 2.0], ["Haferflocken", "Frühstück", 372, 13.5], ["Müsli", "Frühstück", 380, 10], ["Cornflakes", "Frühstück", 357, 7.5], ["Ei", "Protein", 143, 12.6], ["Hähnchenbrust", "Protein", 120, 22.5], ["Rinderhackfleisch", "Protein", 250, 26], ["Lachs", "Protein", 208, 20.4], ["Thunfisch", "Protein", 116, 25.5], ["Tofu", "Protein", 144, 15.5], ["Reis gekocht", "Beilage", 130, 2.7], ["Nudeln gekocht", "Beilage", 158, 5.8], ["Kartoffeln gekocht", "Beilage", 77, 2], ["Süßkartoffel", "Beilage", 86, 1.6], ["Vollkornbrot", "Brot", 247, 13], ["Toastbrot", "Brot", 266, 8.9], ["Quark", "Milchprodukte", 67, 12], ["Skyr", "Milchprodukte", 63, 11], ["Griechischer Joghurt", "Milchprodukte", 97, 9], ["Naturjoghurt", "Milchprodukte", 61, 3.5], ["Milch", "Milchprodukte", 64, 3.4], ["Käse", "Milchprodukte", 350, 25], ["Erdnussbutter", "Aufstrich", 588, 25], ["Nutella", "Aufstrich", 539, 6.3], ["Mandeln", "Snack", 579, 21.2], ["Walnüsse", "Snack", 654, 15.2], ["Proteinriegel", "Snack", 380, 30], ["Chips", "Snack", 536, 6.5], ["Pizza Margherita", "Fertigessen", 266, 11], ["Pommes", "Fertigessen", 312, 3.4]];
const KEY='winter_arc_34';
let s=JSON.parse(localStorage.getItem(KEY)||'null')||{name:'',day:1,xp:0,streak:0,water:0,meals:[],workouts:[],calGoal:2200,proteinGoal:150};
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function totals(){return s.meals.reduce((a,m)=>({cal:a.cal+Number(m.cal||0),pro:a.pro+Number(m.pro||0)},{cal:0,pro:0})}
function show(p){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render();scrollTo(0,0)}
function render(){let t=totals(),p=Math.round(Math.min(90,s.day)/90*100);document.getElementById('date').textContent=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});document.getElementById('avatar').textContent=(s.name||'A')[0].toUpperCase();
document.getElementById('home').innerHTML=`<div class="hero"><div class="tiny">90-TAGE-CHALLENGE</div><h1>DAY ${s.day} / 90</h1><div class="progress"><div class="fill" style="width:${p}%"></div></div><div class="row"><span class="tiny">${p}%</span><b>${s.xp} XP</b></div></div><div class="grid"><div class="tile">🔥 <b>Streak</b><div class="num">${s.streak}</div></div><div class="tile">🏆 <b>Level</b><div class="num">${Math.floor(s.xp/100)+1}</div></div><div class="tile">🥗 <b>Kalorien</b><div class="num">${t.cal}</div><span class="tiny">/ ${s.calGoal}</span></div><div class="tile">💪 <b>Protein</b><div class="num">${t.pro}g</div><span class="tiny">/ ${s.proteinGoal}</span></div></div>`;
document.getElementById('streak').innerHTML=`<div class="hero"><div class="tiny">STREAK</div><h1>🔥 ${s.streak} Tage</h1></div><div class="card"><h2>🏆 Achievements</h2><div class="meal">🔥 3-Tage-Streak ${s.streak>=3?'✓':''}</div><div class="meal">⚡ 7-Tage-Streak ${s.streak>=7?'✓':''}</div><div class="meal">🏆 30-Tage-Streak ${s.streak>=30?'✓':''}</div><div class="meal">👑 90-Tage-Arc ${s.day>=90?'✓':''}</div></div>`;
document.getElementById('stats').innerHTML=`<div class="hero"><h1>Dashboard</h1><p class="tiny">Deine wichtigsten Werte.</p></div><div class="grid"><div class="tile"><b>📈 Arc</b><div class="num">${p}%</div></div><div class="tile"><b>🔥 Streak</b><div class="num">${s.streak}</div></div><div class="tile"><b>🏋️ Workouts</b><div class="num">${s.workouts.length}</div></div><div class="tile"><b>🥗 Mahlzeiten</b><div class="num">${s.meals.length}</div></div></div>`;
food(t);
document.getElementById('workout').innerHTML=`<div class="hero"><h1>🏋️ Workout</h1></div><div class="card"><input id="wn" placeholder="z. B. Push Day"><select id="wt"><option>Kraft</option><option>Cardio</option><option>Mobility</option><option>Ganzkörper</option></select><button class="btn" onclick="addWorkout()">Workout speichern +50 XP</button></div><div class="card">${s.workouts.length?s.workouts.slice().reverse().map(w=>`<div class="meal"><b>${esc(w.name)}</b><div class="tiny">${esc(w.type)} · ${esc(w.date)}</div></div>`).join(''):'<span class="empty">Noch keine Workouts.</span>'}</div>`;
document.getElementById('tools').innerHTML=`<div class="hero"><h1>✦ Tools</h1></div><div class="card"><input id="nm" value="${esc(s.name)}" placeholder="Dein Name"><button class="btn" onclick="saveName()">Speichern</button></div><div class="card"><h2>🎯 Ernährungsziele</h2><input id="cg" type="number" value="${s.calGoal}"><input id="pg" type="number" value="${s.proteinGoal}"><button class="btn" onclick="saveGoals()">Speichern</button></div>`}
function food(t){let q=document.getElementById('foodQ')?.value||'';document.getElementById('food').innerHTML=`<div class="hero"><div class="tiny">OFFLINE SMART FOOD TRACKER</div><h1>🥗 Ernährung</h1><p class="tiny">Kein Internet nötig. Suche in der integrierten Lebensmittelliste.</p></div><div class="grid"><div class="tile"><b>🔥 Kalorien</b><div class="num">${t.cal}</div><span class="tiny">/ ${s.calGoal} kcal</span></div><div class="tile"><b>💪 Protein</b><div class="num">${t.pro}g</div><span class="tiny">/ ${s.proteinGoal}g</span></div></div><div class="card"><h2>🔎 Essen suchen</h2><div class="searchrow"><input id="foodQ" value="${esc(q)}" placeholder="z. B. Banane, Reis, Hähnchen" oninput="searchLocal()"><button class="btn" onclick="searchLocal()">Suchen</button></div><div id="results"></div></div><div class="card"><h2>✍️ Manuell</h2><input id="mn" placeholder="Lebensmittel"><div class="grid"><input id="mc" type="number" placeholder="kcal"><input id="mp" type="number" placeholder="Protein g"></div><button class="btn" onclick="manual()">Eintragen</button></div><div class="card"><h2>Heute gegessen</h2>${s.meals.length?s.meals.map((m,i)=>`<div class="meal"><b>${esc(m.name)}</b><div class="tiny">${m.amount?m.amount+' g · ':''}${m.cal} kcal · ${m.pro}g Protein <button class="btn danger" onclick="delMeal(${i})">×</button></div></div>`).join(''):'<span class="empty">Noch nichts eingetragen.</span>'}</div>`;if(q)searchLocal()}
function searchLocal(){let q=(document.getElementById('foodQ')?.value||'').toLowerCase().trim(),r=document.getElementById('results');if(!r)return;if(!q){r.innerHTML='<div class="empty">Tippe ein Lebensmittel ein.</div>';return}let a=FOODS.filter(f=>f[0].toLowerCase().includes(q)||f[1].toLowerCase().includes(q)).slice(0,10);r.innerHTML=a.length?a.map((f,i)=>`<div class="result" onclick="choose(${i},'${encodeURIComponent(q)}')"><div class="foodicon">🥗</div><div><b>${esc(f[0])}</b><small>${f[2]} kcal · ${f[3]}g Protein / 100g</small></div></div>`).join(''):'<div class="empty">Nicht gefunden — nutze den manuellen Eintrag.</div>';window._results=a}
function choose(i){let f=window._results[i],amount=prompt(`Wie viele Gramm von "${f[0]}"?`,100);if(amount===null)return;amount=Math.max(1,Number(amount)||100);s.meals.push({name:f[0],amount:Math.round(amount),cal:Math.round(f[2]*amount/100),pro:Number((f[3]*amount/100).toFixed(1))});s.xp+=10;save();render();show('food')}
function manual(){let n=document.getElementById('mn').value.trim();if(!n)return;s.meals.push({name:n,cal:Number(document.getElementById('mc').value||0),pro:Number(document.getElementById('mp').value||0)});s.xp+=10;save();render()}
function delMeal(i){s.meals.splice(i,1);save();render()}
function addWorkout(){let n=document.getElementById('wn').value.trim();if(!n)return;s.workouts.push({name:n,type:document.getElementById('wt').value,date:new Date().toLocaleDateString('de-DE')});s.xp+=50;save();render()}
function saveName(){s.name=document.getElementById('nm').value.trim();save();render()}
function saveGoals(){s.calGoal=Number(document.getElementById('cg').value||2200);s.proteinGoal=Number(document.getElementById('pg').value||150);save();render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));save();render();
</script></body></html>
