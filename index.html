<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<title>WINTER ARC 3.1</title>
<style>
:root{--bg:#070a0f;--card:#11161e;--line:#29313d;--text:#f5f7fb;--muted:#8d98a8;--accent:#b9d8f5;--green:#69e0a0}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#101821,#070a0f 40%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:760px;margin:auto;padding:22px 18px 110px}h1{font-size:28px;letter-spacing:3px;margin:5px 0 2px}h2{font-size:25px;margin:8px 0 18px}.date{color:#aeb7c4;margin-bottom:22px}
.card{background:rgba(17,22,30,.92);border:1px solid var(--line);border-radius:28px;padding:22px;margin:14px 0;box-shadow:0 10px 30px #0003}.hero{min-height:245px}.label{color:var(--muted);font-size:15px}.big{font-size:58px;font-weight:750;margin:7px 0}.bar{height:13px;background:#202a35;border-radius:20px;overflow:hidden;margin:22px 0 12px}.fill{height:100%;background:#b9d8f5;border-radius:20px}.row{display:flex;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{padding:20px;border:1px solid var(--line);border-radius:25px;background:#11161e}.tile b{font-size:20px}.tile .num{font-size:34px;font-weight:750;margin-top:10px}.muted{color:var(--muted)}
button,input,select{font:inherit}button{border:1px solid var(--line);background:#151c25;color:var(--text);border-radius:14px;padding:12px 15px}button.primary{background:#dcecff;color:#08101a;border:0;font-weight:700}input,select{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:#0d1219;color:var(--text);margin:7px 0 12px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0b0e14f5;border-top:1px solid #1c232d;display:flex;justify-content:center;z-index:5;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;flex:1;max-width:145px;color:#7f8998;padding:8px 3px}.nav button.active{background:#151d27;color:#fff;border-radius:18px}.ico{font-size:23px;display:block}.nav small{font-size:13px}
.foodstat{font-size:30px;font-weight:750}.meal{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #252d38}.meal:last-child{border-bottom:0}.xp{color:#69e0a0;font-weight:700}.hidden{display:none}
@media(max-width:430px){main{padding-left:16px;padding-right:16px}.grid{gap:10px}.tile{padding:17px}.big{font-size:52px}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="nav">
<button data-page="home"><span class="ico">⌂</span><small>Home</small></button>
<button data-page="plan"><span class="ico">✓</span><small>Plan</small></button>
<button data-page="streak"><span class="ico">🔥</span><small>Streak</small></button>
<button data-page="stats"><span class="ico">◒</span><small>Stats</small></button>
<button data-page="food"><span class="ico">🥗</span><small>Food</small></button>
</nav>
<script>
const key='winterArc31';
let s=JSON.parse(localStorage.getItem(key)||'null')||{day:1,xp:20,streak:1,water:0,tasks:1,calGoal:2200,proteinGoal:150,meals:[]};
function save(){localStorage.setItem(key,JSON.stringify(s))}
function mealsTotal(){return s.meals.reduce((a,m)=>({cal:a.cal+Number(m.cal||0),protein:a.protein+Number(m.protein||0)}),{cal:0,protein:0})}
function page(p){
document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
const d=new Date(), date=d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
let h='';
if(p==='home') h=`<h1>WINTER ARC 3.1</h1><div class="date">${date}</div>
<div class="card hero"><div class="label">DAY</div><div class="big">${s.day} / 90</div><div class="muted">Disziplin ist stärker als Motivation.</div><div class="bar"><div class="fill" style="width:${Math.min(100,s.day/90*100)}%"></div></div><div class="row"><span class="muted">${Math.round(s.day/90*100)}% des Arcs</span><b>${s.xp} XP</b></div></div>
<div class="grid"><div class="tile">🔥 <b>Streak</b><div class="num">${s.streak}</div><span class="muted">Tage in Folge</span></div><div class="tile">🏆 <b>Level</b><div class="num">${Math.floor(s.xp/100)+1}</div><span class="muted">${s.xp%100} / 100 XP</span></div><div class="tile">💧 <b>Wasser</b><div class="num">${s.water}/8</div><span class="muted">Gläser heute</span></div><div class="tile">🥗 <b>Ernährung</b><div class="num">${mealsTotal().cal}</div><span class="muted">kcal heute</span></div></div>
<div class="card"><h2>Heute fokussieren</h2><p>Früh aufstehen</p><p>🏋️ Workout</p><p>📚 Fokuszeit</p><button class="primary" onclick="s.xp+=20;s.tasks=Math.min(6,s.tasks+1);save();page('home')">Aufgabe erledigen +20 XP</button></div>`;
if(p==='food'){let t=mealsTotal();h=`<h1>🥗 ERNÄHRUNG</h1><div class="date">Dein Essen & deine Tagesziele</div>
<div class="grid"><div class="tile"><span class="muted">Kalorien</span><div class="foodstat">${t.cal}</div><span class="muted">/ ${s.calGoal} kcal</span></div><div class="tile"><span class="muted">Protein</span><div class="foodstat">${t.protein} g</div><span class="muted">/ ${s.proteinGoal} g</span></div></div>
<div class="card"><h2>➕ Mahlzeit hinzufügen</h2><label class="muted">Mahlzeit</label><select id="type"><option>Frühstück</option><option>Mittagessen</option><option>Abendessen</option><option>Snack</option></select><input id="foodname" placeholder="Was hast du gegessen?"><input id="cal" type="number" placeholder="Kalorien (kcal)"><input id="protein" type="number" placeholder="Protein (g)"><button class="primary" onclick="addMeal()">Mahlzeit speichern +10 XP</button></div>
<div class="card"><h2>Heute gegessen</h2>${s.meals.length?s.meals.map((m,i)=>`<div class="meal"><div><b>${m.type}</b><br>${m.name}<br><span class="muted">${m.cal} kcal · ${m.protein} g Protein</span></div><button onclick="delMeal(${i})">✕</button></div>`).join(''):'<p class="muted">Noch keine Mahlzeiten eingetragen.</p>'}</div>
<div class="card"><h2>🎯 Tagesziele</h2><input id="goalcal" type="number" value="${s.calGoal}" placeholder="Kalorienziel"><input id="goalpro" type="number" value="${s.proteinGoal}" placeholder="Proteinziel in g"><button onclick="setGoals()">Ziele speichern</button></div>`}
if(p==='plan')h=`<h1>📋 TAGESPLAN</h1><div class="date">90 Tage. Ein Tag nach dem anderen.</div><div class="card"><h2>Day ${s.day}</h2><p>☀️ Früh aufstehen</p><p>🏋️ Training</p><p>💧 8 Gläser Wasser</p><p>📚 60 Min Fokus</p><p>🥗 Ernährung tracken</p></div>`;
if(p==='streak')h=`<h1>🔥 STREAKS</h1><div class="card"><div class="label">AKTUELLER STREAK</div><div class="big">${s.streak} Tage</div><p class="muted">Bleib heute dran, um die Serie fortzusetzen.</p></div>`;
if(p==='stats')h=`<h1>📊 STATS</h1><div class="grid"><div class="tile"><b>90-Tage-Fortschritt</b><div class="num">${Math.round(s.day/90*100)}%</div></div><div class="tile"><b>XP</b><div class="num">${s.xp}</div></div><div class="tile"><b>Mahlzeiten</b><div class="num">${s.meals.length}</div></div><div class="tile"><b>Aufgaben</b><div class="num">${s.tasks}/6</div></div></div>`;
document.getElementById('app').innerHTML=h;
}
function addMeal(){let name=document.getElementById('foodname').value.trim();if(!name)return; s.meals.push({type:document.getElementById('type').value,name,cal:Number(document.getElementById('cal').value||0),protein:Number(document.getElementById('protein').value||0)});s.xp+=10;save();page('food')}
function delMeal(i){s.meals.splice(i,1);save();page('food')}
function setGoals(){s.calGoal=Number(document.getElementById('goalcal').value||2200);s.proteinGoal=Number(document.getElementById('goalpro').value||150);save();page('food')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));
page('home');
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
